name: release

on:
  push:
    tags:
      - "v*"

# Least privilege: only the publish job writes release contents. The build jobs
# run npm install (third-party scripts) and must not hold a write token.
permissions:
  contents: read

jobs:
  backend-tarball:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build backend tarball
        run: bash scripts/release/build-backend-tarball.sh "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: dist-release/*

  provision-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build provision.sh
        run: bash scripts/provision/build.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: provision
          path: scripts/provision/dist/provision.sh

  publish:
    needs: [backend-tarball, provision-script]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          cat *.sha256 > SHA256SUMS 2>/dev/null || true
          jq -n --arg v "${GITHUB_REF_NAME#v}" '{version:$v,minProtocol:1}' > latest.json
          ls -la
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
