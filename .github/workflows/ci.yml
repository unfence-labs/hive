name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build website
        run: npm run build --workspace=website

  ios:
    # Temporarily disabled to avoid paid macOS runner usage on the private repository.
    # Remove this condition to restore Swift tests and the iOS build.
    if: ${{ false }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Test Swift package
        working-directory: ios
        run: swift test

      - name: Build iOS app
        working-directory: ios
        run: xcodebuild -project HiveMobile.xcodeproj -scheme HiveMobile -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
