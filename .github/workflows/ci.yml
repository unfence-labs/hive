name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build and inspect backend release
        run: bash scripts/release/build-backend-tarball.sh 0.0.0-ci x64

      - name: Provision script (shellcheck + error-taxonomy contract)
        run: |
          bash scripts/provision/build.sh
          bash test/provision/contract.sh

  ios:
    # Temporarily disabled to avoid paid macOS runner usage on the private repository.
    # Remove this condition to restore Swift tests and the iOS build.
    if: ${{ false }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Swift package
        working-directory: ios
        run: swift test

      - name: Build iOS app
        working-directory: ios
        run: xcodebuild -project HiveMobile.xcodeproj -scheme HiveMobile -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test sidecar
        working-directory: frontend/src-tauri
        run: cargo test --locked
      - name: Check release build
        working-directory: frontend/src-tauri
        run: cargo check --release --locked

  provision-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install and re-run provisioning
        run: make provision-docker

  # Chaos/rollback/download lanes live in provision-resilience.yml: they run
  # on PRs only when provision code changes, plus weekly and on dispatch.
